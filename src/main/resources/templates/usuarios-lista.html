<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Usuarios | BarberPro</title>
    <div th:replace="~{layout/sidebar :: head_comun}"></div>
    <link rel="stylesheet" th:href="@{/css/admin-style.css}">
</head>

<body class="bg-light">

    <div th:replace="~{layout/sidebar :: sidebar_menu(activePage='usuarios')}"></div>

    <div class="main-content pt-4">
        <div class="container-fluid">

            <!-- Alerta de error por límite desde el backend -->
            <div th:if="${errorLimite}" class="alert alert-warning alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>
                <span th:text="${errorLimite}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Encabezado con botón y badge -->
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <h2 class="fw-bold m-0">Gestión de Personal</h2>
                    <p class="text-muted m-0 small">Administra los usuarios y roles del sistema.</p>
                </div>
                <button class="btn btn-primary shadow-sm d-flex align-items-center gap-2" id="btnNuevoUsuario">
                    <i class="fa-solid fa-user-plus"></i>
                    Nuevo Usuario
                    <span id="badgeContador" class="badge text-white rounded-pill"
                          style="background-color: rgba(255,255,255,0.25); font-size: 0.75rem;">
                        …
                    </span>
                </button>
            </div>

            <!-- Barra de progreso de usuarios -->
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="flex-grow-1"
                     style="height: 5px; background-color: #2d2d3a; border-radius: 99px; overflow: hidden;">
                    <div id="barraUsuarios"
                         style="height: 100%; width: 0%; background-color: #f97316;
                                border-radius: 99px; transition: width 0.5s ease, background-color 0.3s;">
                    </div>
                </div>
                <span id="textoContador" class="text-muted small" style="white-space: nowrap;">cargando…</span>
            </div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-uppercase small">
                                <tr>
                                    <th class="ps-4">ID</th>
                                    <th>Nombre</th>
                                    <th>Email</th>
                                    <th>Rol</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="u : ${usuarios}">
                                    <td class="ps-4 fw-bold" th:text="${u.id}"></td>
                                    <td th:text="${u.nombre}"></td>
                                    <td th:text="${u.email}"></td>
                                    <td>
                                        <span class="badge bg-light text-dark border"
                                            th:text="${u.perfil.nombrePerfil}"></span>
                                    </td>
                                    <td>
                                        <label th:if="${u.email != usuarioLogueado}" class="switch mb-0">
                                            <input type="checkbox" th:checked="${u.estado == 1}"
                                                th:onchange="'window.location.href=\'/admin/usuarios/estado/' + ${u.id} + '\''">
                                            <span class="slider"></span>
                                        </label>
                                        <i th:if="${u.email == usuarioLogueado}"
                                            class="fa-solid fa-lock text-muted fs-6"></i>
                                    </td>
                                    <td>
                                        <button class="btn btn-sm btn-outline-warning rounded-circle me-1"
                                            onclick="prepararEdicion(this)"
                                            th:data-id="${u.id}"
                                            th:data-nombre="${u.nombre}"
                                            th:data-email="${u.email}"
                                            th:data-perfil="${u.perfil.id}"
                                            title="Editar">
                                            <i class="fa-solid fa-pen"></i>
                                        </button>
                                        <a th:if="${u.email != usuarioLogueado}"
                                            th:href="@{/admin/usuarios/eliminar/{id}(id=${u.id})}"
                                            class="btn btn-sm btn-outline-danger rounded-circle"
                                            onclick="return confirm('¿Dar de baja al usuario?');"
                                            title="Eliminar">
                                            <i class="fa-solid fa-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVO USUARIO -->
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">
                        <i class="fa-solid fa-user-plus me-2"></i>Nuevo Usuario
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/usuarios/guardar}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase">Nombre</label>
                            <input type="text" name="nombre" class="form-control"
                                   pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+"
                                   title="El nombre no puede contener números" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase">Contraseña</label>
                            <input type="password" name="password" class="form-control"
                                   pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$"
                                   title="Mínimo 8 caracteres con letras y números" required>
                            <small class="text-muted">Mínimo 8 caracteres con letras y números</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase">Rol</label>
                            <select name="perfilId" class="form-select" required>
                                <option value="">-- Selecciona un rol --</option>
                                <option th:each="p : ${perfiles}"
                                        th:value="${p.id}"
                                        th:text="${p.nombrePerfil}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary px-4">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL EDITAR USUARIO -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title fw-bold">
                        <i class="fa-solid fa-pen me-2"></i>Editar Usuario
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/usuarios/editar}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="id" id="editId">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase">Nombre</label>
                            <input type="text" name="nombre" id="editNombre" class="form-control"
                                   pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+"
                                   title="El nombre no puede contener números" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase">Email</label>
                            <input type="email" name="email" id="editEmail" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold small text-uppercase">Rol</label>
                            <select name="perfilId" id="editPerfil" class="form-select" required>
                                <option th:each="p : ${perfiles}"
                                        th:value="${p.id}"
                                        th:text="${p.nombrePerfil}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer bg-light border-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-warning px-4 fw-bold">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/usuarios.js}"></script>
</body>
</html>
