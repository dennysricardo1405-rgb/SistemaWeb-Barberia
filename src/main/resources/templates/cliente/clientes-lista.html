<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Clientes | BarberPro</title>
    <div th:replace="~{layout/sidebar :: head_comun}"></div>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body class="bg-light">

    <div th:replace="~{layout/sidebar :: sidebar_menu(activePage='Clientes')}"></div>

    <div class="main-content pt-4">
        <div class="container-fluid">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-0">
                        <i class="fa-solid fa-user-group me-2" style="color:#ff6b2b"></i>Clientes
                    </h2>
                    <small class="text-muted">Gestión de clientes registrados</small>
                </div>
                <button class="btn btn-primary shadow-sm"
                        data-bs-toggle="modal" data-bs-target="#modalNuevo">
                    <i class="fa-solid fa-user-plus me-2"></i> Nuevo Cliente
                </button>
            </div>

            <!-- Mensajes flash -->
            <div th:if="${exito}" class="alert alert-success alert-dismissible fade show">
                <i class="fa-solid fa-circle-check me-2"></i>
                <span th:text="${exito}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="fa-solid fa-circle-xmark me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light text-uppercase small">
                                <tr>
                                    <th class="ps-4">Cliente</th>
                                    <th>DNI</th>
                                    <th>Teléfono</th>
                                    <th>Correo</th>
                                    <th>Registro</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="c : ${clientes}">
                                    <td class="ps-4">
                                        <div class="d-flex align-items-center gap-3">
                                            <div class="cliente-avatar"
                                                 th:text="${#strings.substring(c.nombres,0,1)}">
                                            </div>
                                            <div>
                                                <div class="fw-bold"
                                                     th:text="${c.nombres + ' ' + c.apellidos}">
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                    <td th:text="${c.dni}" class="fw-bold"></td>
                                    <td th:text="${c.telefono ?: '—'}"></td>
                                    <td th:text="${c.correo ?: '—'}"></td>
                                    <td th:text="${#temporals.format(c.fechaRegistro,'dd/MM/yyyy')}"></td>
                                    <td>
                                        <label class="switch mb-0">
                                            <input type="checkbox"
                                                   th:checked="${c.estado == 1}"
                                                   th:onchange="'window.location.href=\'/admin/cliente/estado/' + ${c.id} + '\''">
                                            <span class="slider"></span>
                                        </label>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(clientes)}">
                                    <td colspan="6" class="text-center text-muted py-5">
                                        <i class="fa-solid fa-user-group fa-2x mb-3 d-block"
                                           style="color:#ff6b2b; opacity:0.3"></i>
                                        No hay clientes registrados
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVO CLIENTE -->
    <div class="modal fade" id="modalNuevo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">
                        <i class="fa-solid fa-user-plus me-2"></i>Registrar Cliente
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/admin/cliente/guardar}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="modal-body p-4">
                        <div class="row g-3">

                            <!-- DNI con búsqueda -->
                            <div class="col-md-6">
                                <label class="form-label">DNI</label>
                                <div class="input-dni-group">
                                    <input type="text" id="dniInput" name="dni"
                                           class="form-control"
                                           oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                                           maxlength="8" pattern=".{8,8}"
                                           title="El DNI debe tener 8 dígitos" required>
                                    <button type="button" id="btnBuscarDni"
                                            class="btn-search-dni" onclick="buscarDni()">
                                        <i class="fa-solid fa-magnifying-glass"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Teléfono</label>
                                <input type="text" name="telefono" class="form-control"
                                       oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                                       maxlength="9" pattern=".{9,9}"
                                       title="9 dígitos">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Nombres</label>
                                <input type="text" id="nombresInput" name="nombres"
                                       class="form-control" readonly required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Apellidos</label>
                                <input type="text" id="apellidosInput" name="apellidos"
                                       class="form-control" readonly required>
                            </div>

                            <div class="col-12">
                                <label class="form-label">Correo electrónico</label>
                                <input type="email" name="correo" class="form-control"
                                       placeholder="cliente@gmail.com" required>
                            </div>

                            <div class="col-12">
    <div class="alert alert-info py-2 mb-0" style="font-size:0.82rem;">
        <i class="fa-solid fa-info-circle me-1"></i>
        La contraseña se generará automáticamente: <strong>B + DNI del cliente</strong>
    </div>
</div>


                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" id="btnGuardarCliente" 
        class="btn btn-primary px-4" onclick="guardarCliente()">
    Registrar Cliente
</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/clientes.js}"></script>
</body>
</html>
