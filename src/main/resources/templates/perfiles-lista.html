<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Configurar Roles | BarberPro</title>
    <div th:replace="~{layout/sidebar :: head_comun}"></div>
    <link rel="stylesheet" th:href="@{/css/perfiles.css}">
</head>

<body class="bg-dark-custom text-white">

    <div th:replace="~{layout/sidebar :: sidebar_menu(activePage='perfiles')}"></div>

    <div class="main-content pt-4">
        <div class="container-fluid">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold m-0 text-white">Roles y Accesos</h2>
                    <p class="text-muted m-0">Define qué puede hacer cada perfil en el sistema.</p>
                </div>
            </div>

            <div class="row g-4">
                <div th:each="p : ${perfiles}" class="col-md-6 col-lg-4">
                    <div class="card h-100 border-0 shadow-lg" style="background-color: #212529; border-radius: 16px;">
                        <div class="card-body d-flex flex-column p-4">

                            <div class="mb-3">
                                <span class="badge text-uppercase fw-bold mb-2 px-2.5 py-1.5"
                                    style="background-color: #ff6b35; color: #ffffff; font-size: 0.7rem; letter-spacing: 0.5px;">
                                    Rol del Sistema
                                </span>
                                <h3 class="fw-bold text-white m-0 mt-1" style="font-size: 1.6rem;"
                                    th:text="${p.nombrePerfil}"></h3>
                            </div>

                            <div class="mb-4 flex-grow-1">
                                <div th:if="${not #lists.isEmpty(p.permisos)}" class="d-flex flex-wrap gap-2 pt-2">
                                    <span th:each="perm : ${p.permisos}" th:text="${perm.descripcion}"
                                        class="badge fw-medium text-wrap text-start"
                                        style="background-color: #2c3034; color: #dee2e6; border: 1px solid #3d4246; padding: 8px 12px; font-size: 0.8rem; border-radius: 8px; line-height: 1.4;">
                                    </span>
                                </div>
                                <div th:if="${#lists.isEmpty(p.permisos)}" class="text-muted small pt-2 italic">
                                    <i class="fa-solid fa-circle-info me-1"></i> Sin permisos asignados.
                                </div>
                            </div>

                            <div class="pt-2">
                                <button
                                    class="btn w-100 py-2.5 fw-bold d-flex align-items-center justify-content-center transition-all"
                                    type="button"
                                    style="background-color: transparent; color: #ff6b35; border: 2px solid #ff6b35; border-radius: 10px; font-size: 0.9rem; gap: 8px;"
                                    onmouseover="this.style.backgroundColor='#ff6b35'; this.style.color='#ffffff';"
                                    onmouseout="this.style.backgroundColor='transparent'; this.style.color='#ff6b35';"
                                    th:data-id="${p.id}" th:data-nombre="${p.nombrePerfil}"
                                    th:data-permisos="${#strings.listJoin(p.permisos.![id], ',')}"
                                    onclick="abrirModalPermisos(this)">
                                    <i class="fa-solid fa-sliders"></i> Configurar Accesos
                                </button>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="modal fade" id="modalPermisos" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow bg-dark text-white">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title">
                        <i class="fa-solid fa-shield-halved me-2 text-warning"></i>
                        Accesos para: <span id="nombrePerfilModal" class="fw-bold text-warning"></span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <form th:action="@{/admin/perfiles/guardar-permisos}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="perfilId" id="perfilIdInput">

                    <div class="modal-body p-4">
                        <p class="text-muted small mb-3">Selecciona los módulos a los que este perfil tendrá acceso:</p>

                        <div class="list-group list-group-flush">
                            <div th:each="perm : ${todosLosPermisos}"
                                class="list-group-item bg-transparent border-0 px-0 text-white checkbox-wrapper">
                                <div class="form-check form-switch">
                                    <input class="form-check-input custom-switch" type="checkbox" name="permisoIds"
                                        th:value="${perm.id}" th:id="'perm' + ${perm.id}">
                                    <label class="form-check-label fw-medium style-label" th:for="'perm' + ${perm.id}"
                                        th:text="${perm.descripcion}"></label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer border-top border-secondary">
                        <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cerrar</button>
                        <button type="submit" class="btn btn-warning px-4 fw-bold">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/perfiles.js}"></script>
</body>

</html>
