<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Configurar Roles | BarberPro</title>
    <div th:replace="~{layout/sidebar :: head_comun}"></div>
    <link rel="stylesheet" th:href="@{/css/perfiles.css}">
</head>

<body class="bg-light">

    <div th:replace="~{layout/sidebar :: sidebar_menu(activePage='perfiles')}"></div>

    <div class="main-content pt-4">
        <div class="container-fluid">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold m-0">Roles y Accesos</h2>
                    <p class="text-muted m-0">Define qué puede hacer cada perfil en el sistema.</p>
                </div>
            </div>

            <div class="row g-4">
                <div th:each="p : ${perfiles}" class="col-md-4">
                    <div class="card perfil-card shadow-sm h-100">
                        <div class="card-body d-flex flex-column">
                            <div class="mb-3">
                                <span class="badge bg-primary mb-2">Rol del Sistema</span>
                                <h4 class="fw-bold" th:text="${p.nombrePerfil}"></h4>
                            </div>

                            <div class="mb-4 flex-grow-1">
                                <p class="small fw-bold text-uppercase text-muted mb-2">Permisos activos:</p>
                                <div th:if="${not #lists.isEmpty(p.permisos)}">
                                    <span th:each="perm : ${p.permisos}"
                                          th:text="${perm.descripcion}"
                                          class="badge bg-light text-dark border me-1 mb-1"></span>
                                </div>
                                <div th:if="${#lists.isEmpty(p.permisos)}" class="text-muted small">
                                    Sin permisos asignados.
                                </div>
                            </div>

                            <button class="btn btn-dark w-100 rounded-pill" type="button"
                                    th:data-id="${p.id}"
                                    th:data-nombre="${p.nombrePerfil}"
                                    th:data-permisos="${#strings.listJoin(p.permisos.![id], ',')}"
                                    onclick="abrirModalPermisos(this)">
                                <i class="fa-solid fa-user-lock me-2"></i> Configurar Accesos
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- MODAL PERMISOS -->
    <div class="modal fade" id="modalPermisos" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white border-0">
                    <h5 class="modal-title">
                        <i class="fa-solid fa-shield-halved me-2"></i>
                        Accesos para: <span id="nombrePerfilModal" class="fw-bold"></span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>

                <form th:action="@{/admin/perfiles/guardar-permisos}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="perfilId" id="perfilIdInput">

                    <div class="modal-body p-4">
                        <p class="text-muted small mb-3">Selecciona los módulos a los que este perfil tendrá acceso:</p>

                        <div class="list-group list-group-flush">
                            <div th:each="perm : ${todosLosPermisos}"
                                 class="list-group-item border-0 px-0">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox"
                                           name="permisoIds"
                                           th:value="${perm.id}"
                                           th:id="'perm' + ${perm.id}">
                                    <label class="form-check-label fw-medium"
                                           th:for="'perm' + ${perm.id}"
                                           th:text="${perm.descripcion}"></label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer bg-light border-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <button type="submit" class="btn btn-primary px-4">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/perfiles.js}"></script>
</body>
</html>
