<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Dashboard | BarberPro</title>
    <div th:replace="~{layout/sidebar :: head_comun}"></div>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>
    <div th:replace="~{layout/sidebar :: sidebar_menu(activePage='dashboard')}"></div>

    <div class="main-content">
        <div class="container-fluid">

            <div class="welcome-banner d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="fw-bold mb-1">
                        ¡Bienvenido, <span th:text="${usuarioNombre}">Usuario</span>!
                    </h2>
                    <p class="text-muted mb-0">Resumen operativo de BarberPro.</p>
                </div>
                <div class="text-end">
                    <h5 class="mb-0 text-primary fw-bold"
                        th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}"></h5>
                </div>
            </div>

            <div class="row g-4">

                <!-- Total Barberos -->
                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card shadow-sm h-100"
                         onclick="location.href='/admin/barberos'" style="cursor:pointer;">
                        <div class="card-body d-flex justify-content-between">
                            <div>
                                <h6 class="text-muted small fw-bold text-uppercase">Barberos</h6>
                                <h2 class="fw-bold" th:text="${totalBarberos}">0</h2>
                            </div>
                            <div class="icon-box bg-primary-subtle text-primary">
                                <i class="fa-solid fa-cut"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Citas Hoy -->
                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card bg-gradient-green text-white shadow-sm h-100"
                         onclick="location.href='/admin/citas'" style="cursor:pointer;">
                        <div class="card-body d-flex justify-content-between">
                            <div>
                                <h6 class="text-white-50 small fw-bold text-uppercase">Citas Hoy</h6>
                                <h2 class="fw-bold" th:text="${citasHoy}">0</h2>
                            </div>
                            <div class="icon-box bg-white-50">
                                <i class="fa-solid fa-calendar-check"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Total Clientes -->
                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card shadow-sm h-100"
                         onclick="location.href='/admin/clientes'" style="cursor:pointer;">
                        <div class="card-body d-flex justify-content-between">
                            <div>
                                <h6 class="text-muted small fw-bold text-uppercase">Clientes</h6>
                                <h2 class="fw-bold" th:text="${totalClientes}">0</h2>
                            </div>
                            <div class="icon-box bg-purple-subtle text-purple">
                                <i class="fa-solid fa-user-group"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Ingresos del Mes -->
                <div class="col-xl-3 col-md-6">
                    <div class="card stat-card bg-gradient-blue text-white shadow-sm h-100">
                        <div class="card-body d-flex justify-content-between">
                            <div>
                                <h6 class="text-white-50 small fw-bold text-uppercase">Ingresos Mes</h6>
                                <h2 class="fw-bold" th:text="'S/ ' + ${ingresosMes}">S/ 0.00</h2>
                            </div>
                            <div class="icon-box bg-white-50">
                                <i class="fa-solid fa-money-bill-trend-up"></i>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
